name: Build VHD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/vhd

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install qemu-img
        run: |
          sudo apt-get update
          sudo apt-get install -y dnf qemu-utils

      - name: Install uv
        uses: astral-sh/setup-uv@7edac99f961f18b581bbd960d59d049f04c0002f # v6.4.3

      # Required for ubuntu-24.04
      - name: Disable AppArmor userns restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build image.vhd
        run: make image.vhd

      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push VHD to GHCR via ORAS
        id: push
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          TAG="sha-${GITHUB_SHA::12}"

          DIGEST=$(oras push \
            --artifact-type application/vnd.microsoft.azure.vhd \
            --format go-template='{{.digest}}' \
            "${IMAGE}:${TAG}" \
            image.vhd:application/vnd.microsoft.azure.vhd)

          oras tag "${IMAGE}:${TAG}" latest

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
